<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniCPM-o 5 API 控制面板</title>
  <link rel="stylesheet" href="/control/static/panel.css">
</head>
<body>
  <header>
    <h1>MiniCPM-o 5 API 控制面板</h1>
    <nav><a href="/api-docs" target="_blank">API 调用文档</a> <button id="logout" hidden>退出</button></nav>
  </header>

  <form id="login" hidden>
    <p>请输入控制面板密码：</p>
    <input id="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">进入</button>
    <span id="login-error" class="err"></span>
  </form>

  <main id="main" hidden>
    <div id="notice" class="notice" role="status"></div>

    <section>
      <div class="section-head">
        <h2>端点</h2>
        <form id="new-endpoint" class="inline">
          <input name="name" placeholder="端点名（如 f9t4）" required pattern="[a-z0-9][a-z0-9\-]{0,39}">
          <input name="description" placeholder="说明（可选）">
          <button type="submit">新建端点</button>
        </form>
      </div>
      <div id="endpoints"></div>
    </section>

    <section>
      <div class="section-head"><h2>Worker 模板</h2><span class="hint">一个模板 = 一个 checkpoint 及其训练口径；新建 / 扩容 Worker 都从模板起</span></div>
      <table id="templates"><thead><tr>
        <th>名字</th><th>checkpoint 目录</th><th>tts_pad</th><th>预算 听/说</th><th>Unit</th><th>说明</th><th></th>
      </tr></thead><tbody></tbody></table>
      <details id="template-editor">
        <summary>新建 / 编辑模板</summary>
        <form id="template-form" class="grid">
          <label>名字<input name="name" required pattern="[a-z0-9][a-z0-9\-]{0,47}" placeholder="f9t4-rejection-iter2000"></label>
          <label class="wide">checkpoint 目录（含 model.pt 与 backbone/）<input name="model_dir" required placeholder="/backup/user/.../iter_0002000"></label>
          <label>tts_pad 口径<select name="tts_pad_protocol" required>
            <option value="">— 必选 —</option><option value="legacy">legacy（SDK ≤0.0.6a3 训）</option><option value="revised">revised（SDK ≥0.0.6a4 训）</option>
          </select></label>
          <label>听时预算<input name="non_spoken_budget_while_listening" type="number" min="1" value="45"></label>
          <label>说时预算<input name="non_spoken_budget_while_speaking" type="number" min="1" value="25"></label>
          <label>Unit 秒<input name="unit_sec" type="number" step="0.1" min="0.1" value="1.0"></label>
          <label>调度<select name="non_spoken_scheduling"><option>quality</option><option>latency</option></select></label>
          <label class="wide">说明<input name="note"></label>
          <div class="wide"><button type="submit">保存模板</button></div>
        </form>
      </details>
    </section>
  </main>

  <script type="module" src="/control/static/panel.js"></script>
</body>
</html>
