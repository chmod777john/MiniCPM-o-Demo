# MiniCPM-o 多 worker 单 gateway 部署(docker compose)
#
# 架构:
#   gateway        ×1   :8006   torch-free 控制面;/v1/realtime 入口 + 调度 + 录制
#   worker-backend ×N   每个独占 1 张 GPU;容器内 backend(:22500)+ worker(:22400,纯转发)
#
# 拓扑要点:
#   - 每个 worker-backend 显式绑定一张特定 GPU(device_ids),不能用 --scale(会抢同一张卡)。
#   - 容器内 GPU 永远是 0(GPU_ID=0):reservation 决定它看到宿主机哪张卡,容器内就叫 cuda:0。
#   - worker 启动后向 gateway 内部端口动态注册，gateway 不再持有静态 worker 列表。
#   - worker-backend 挂模型(只读)、不挂 data(纯净);gateway 挂 data(录制持久化)、不要 GPU。
#   - 模型权重和 Token2Wav assets 不进镜像,运行时挂载;路径由 *_HOST_PATH 指定。
#
# 增减 GPU = 增删 worker-backend-N service；worker 会自动注册到 gateway。
#
# 用法:
#   WEIGHTS_HOST_PATH=/path/to/o5-full-bundle \
#   ASSETS_HOST_PATH=/path/to/o5-assets docker compose up -d --build
#   docker compose logs -f gateway
#   docker compose logs -f worker-backend-0

x-worker-backend: &worker-backend-base
  build:
    context: .
    dockerfile: docker/Dockerfile.worker-backend
  image: minicpm-o5-full-worker:dev
  environment:
    GPU_ID: "0"            # 容器内恒为 0(见上)
    BACKEND_PORT: "22500"
    WORKER_PORT: "22400"
    WEIGHTS_DIR: /models/o5-full-bundle
    ASSETS_DIR: /models/o5-assets
    O5_DEPLOY_MODE: "${O5_DEPLOY_MODE:-single_eager}"
    O5_ATTN_IMPLEMENTATION: "${O5_ATTN_IMPLEMENTATION:-sdpa}"
    GATEWAY_REGISTRY_URL: "http://gateway:8007/internal/workers"
  restart: unless-stopped
  healthcheck:
    # 查 worker /health;转发模式下 backend 是否就绪由 entrypoint 门控保证
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:22400/health"]
    interval: 15s
    timeout: 5s
    retries: 40          # 模型加载 ~90s,给足重试(40×15s=10min)
    start_period: 120s
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "3"}

services:
  worker-backend-0:
    <<: *worker-backend-base
    container_name: minicpm-o5-full-wb-0
    environment:
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      WEIGHTS_DIR: /models/o5-full-bundle
      ASSETS_DIR: /models/o5-assets
      GATEWAY_REGISTRY_URL: "http://gateway:8007/internal/workers"
      WORKER_ID: "worker-backend-0"
      WORKER_ENDPOINT: "worker-backend-0:22400"
      WORKER_GPU_GROUP: "gpu-0"
    volumes:
      - ${WEIGHTS_HOST_PATH:?set WEIGHTS_HOST_PATH to the host safetensors bundle}:/models/o5-full-bundle:ro
      - ${ASSETS_HOST_PATH:?set ASSETS_HOST_PATH to the host runtime assets}:/models/o5-assets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  worker-backend-1:
    <<: *worker-backend-base
    container_name: minicpm-o5-full-wb-1
    environment:
      GPU_ID: "0"
      BACKEND_PORT: "22500"
      WORKER_PORT: "22400"
      WEIGHTS_DIR: /models/o5-full-bundle
      ASSETS_DIR: /models/o5-assets
      GATEWAY_REGISTRY_URL: "http://gateway:8007/internal/workers"
      WORKER_ID: "worker-backend-1"
      WORKER_ENDPOINT: "worker-backend-1:22400"
      WORKER_GPU_GROUP: "gpu-1"
    volumes:
      - ${WEIGHTS_HOST_PATH:?set WEIGHTS_HOST_PATH to the host safetensors bundle}:/models/o5-full-bundle:ro
      - ${ASSETS_HOST_PATH:?set ASSETS_HOST_PATH to the host runtime assets}:/models/o5-assets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: minicpm-o5-full-gateway:dev
    container_name: minicpm-o5-full-gateway
    # HTTPS:实时音视频页面(omni/audio_duplex)需要 https —— 浏览器仅在 https/localhost
    # 下提供 navigator.mediaDevices(麦克风)。证书从宿主机挂载(不进镜像),默认读 certs/cert.pem。
    # 纯文字 /turnbased 不需要麦克风,http 也能用;要降级 http 把下面 --https 段换成 ["--http"]。
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8006"
      - "--internal-port"
      - "8007"
      - "--https"
      - "--ssl-certfile"
      - "/app/certs/cert.pem"
      - "--ssl-keyfile"
      - "/app/certs/key.pem"
    ports:
      - "${GATEWAY_HOST_PORT:-8006}:8006"
    expose:
      - "8007"
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data      # session 录制持久化到 host
      - ${CERTS_HOST_PATH:-./certs}:/app/certs:ro # TLS 证书从宿主机挂载(只读),不进镜像
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
